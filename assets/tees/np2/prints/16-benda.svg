<!-- NOUVEAUX PUNK 2 capsule - 26
     Print artwork, vector, transparent ground.
     Ink #e8dc12 on a #0b1719 (black) blank.
     Drawn 100x100 and scaled to 3000x3000, so it goes to DTF film at any
     size with no resampling. Identical paths to the site mockup.
     !! CONTAINS LIVE TEXT (Helvetica/Arial/Courier). Convert type to
        outlines in Illustrator/Affinity before sending to the printer, or
        the shop may substitute a different face. -->
<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="3000" viewBox="0 0 100 100">
  <title>NOUVEAUX PUNK 2 - 26</title>
  <g><text x="50" y="62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="52" letter-spacing="-2" fill="#e8dc12">26</text><rect x="18" y="70" width="64" height="2.6" fill="#f2ec7d"/><text x="50" y="83" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="7.5" letter-spacing="2.2" fill="#f2ec7d">SONGS · YEARS</text></g>
</svg>
