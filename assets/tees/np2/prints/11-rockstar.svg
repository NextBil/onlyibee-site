<?xml version="1.0" encoding="UTF-8"?>
<!-- NOUVEAUX PUNK 2 capsule - ONLY IBEE
     Print artwork, vector, transparent ground.
     Ink #ff1f6f on a #0b1719 (black) blank.
     Drawn 100x100 and scaled to 3000x3000, so it goes to DTF film at any
     size with no resampling. Identical paths to the site mockup.
     !! CONTAINS LIVE TEXT (Helvetica/Arial/Courier). Convert type to
        outlines in Illustrator/Affinity before sending to the printer, or
        the shop may substitute a different face. -->
<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="3000" viewBox="0 0 100 100">
  <title>NOUVEAUX PUNK 2 - ONLY IBEE</title>
  <g><rect x="0" y="33" width="100" height="34" fill="#ff1f6f"/><rect x="0" y="29" width="100" height="2.5" fill="#ff84b0" opacity=".75"/><rect x="0" y="67.5" width="100" height="2.5" fill="#ff84b0" opacity=".75"/><text x="50" y="54.5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="13" letter-spacing="0.5" fill="#fff">ONLY IBEE</text></g>
</svg>
