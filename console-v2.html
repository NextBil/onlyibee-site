<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>ONLY IBEE OS — console v2 (prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070707;--ink:#e8e8e8;--dim:#7a7a7a;
  --acid:#b6ff00;--red:#ff2b2b;--cyan:#26e0ff;--pink:#ff2bd6;--gold:#ffd60a;--border:#242424;
  --px:'Press Start 2P',monospace;--vt:'VT323',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,rgba(38,224,255,.06),transparent 60%),var(--bg);
  color:var(--ink);font-family:var(--vt);font-size:20px;overflow-x:hidden;min-height:100dvh;
  display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9000;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9001;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.5) 100%)}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--border);z-index:5}
.brand{font-family:var(--px);font-size:12px;letter-spacing:1px;color:var(--acid)}.brand .r{color:var(--red)}
.top .sp{flex:1}
.chip{font-family:var(--px);font-size:8px;letter-spacing:1px;color:var(--dim);border:1px solid var(--border);
  padding:6px 8px;display:flex;align-items:center;gap:6px;background:#0a0a0a}
.chip.coin{color:var(--gold)}
.dt{width:6px;height:6px;border-radius:50%;background:var(--acid);box-shadow:0 0 7px var(--acid);animation:bl 1.4s steps(1) infinite}
.chip.coin .dt{background:var(--gold);box-shadow:0 0 7px var(--gold)}
@keyframes bl{50%{opacity:.25}}
.hello{padding:14px 16px 2px;z-index:5}
.hello h1{font-family:var(--px);font-size:12px;letter-spacing:1px;line-height:1.7}

/* the grid */
.grid{flex:1;display:grid;gap:12px;padding:12px 16px 150px;z-index:5;max-width:1080px;margin:0 auto;width:100%;
  grid-template-columns:repeat(2,1fr);align-content:start}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}

/* a box is mostly a big preview; text hides until you tap it */
.box{--ac:var(--acid);position:relative;border:2px solid var(--border);background:#0a0a0a;overflow:hidden;
  cursor:pointer;aspect-ratio:1/1;transition:transform .16s cubic-bezier(.2,.8,.2,1),border-color .16s,box-shadow .16s}
.box::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--ac);opacity:.9;z-index:4}
.box:hover,.box.sel{transform:translateY(-4px) scale(1.012);border-color:var(--ac);
  box-shadow:0 12px 34px rgba(0,0,0,.55),0 0 26px color-mix(in srgb,var(--ac) 32%,transparent);outline:none}
.box.wide{grid-column:1 / -1;aspect-ratio:auto;min-height:210px}

.peek{position:absolute;inset:0;background:#050505 center/cover no-repeat;background-image:var(--img)}
.peek::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,transparent 30%,rgba(0,0,0,.2) 55%,rgba(0,0,0,.86) 100%)}
.peek.contain{background-size:auto 74%;background-position:center 42%}
.tvvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* the rotating voxel icon — same technique as the site menu */
.ico{position:absolute;top:11px;left:11px;width:46px;height:46px;z-index:3;perspective:230px}
.box.wide .ico{width:64px;height:64px;top:14px;left:14px}
.o3{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;animation:sp 5.5s linear infinite}
.o3 img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
@keyframes sp{from{transform:rotateY(0) rotateX(8deg)}to{transform:rotateY(360deg) rotateX(8deg)}}
.box:hover .o3,.box.sel .o3{animation-duration:2.4s}

.nm{position:absolute;left:14px;bottom:12px;z-index:3;font-family:var(--px);font-size:13px;letter-spacing:1px;
  color:#fff;text-shadow:0 2px 8px #000,0 0 14px color-mix(in srgb,var(--ac) 45%,transparent)}
.box.wide .nm{font-size:16px;bottom:16px;left:18px}
.cnt{position:absolute;right:12px;bottom:13px;z-index:3;font-family:var(--px);font-size:8px;color:var(--ac);
  background:rgba(0,0,0,.55);padding:5px 7px}

/* the info panel — only when the box is tapped (before entering) */
.info{position:absolute;inset:0;z-index:5;background:linear-gradient(180deg,rgba(6,6,6,.35),rgba(6,6,6,.92));
  display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:16px 15px;overflow:hidden;
  opacity:0;pointer-events:none;transform:translateY(14px);
  transition:opacity .2s ease,transform .22s cubic-bezier(.2,.8,.2,1)}
.box.sel .info{opacity:1;pointer-events:auto;transform:translateY(0)}
.info .tg{font-family:var(--px);font-size:7px;letter-spacing:1px;color:var(--ac)}
.info .ds{color:#cfcfcf;font-size:17px;line-height:1.35}
.info .en{align-self:flex-start;margin-top:6px;font-family:var(--px);font-size:9px;letter-spacing:1px;
  color:#07120a;background:var(--ac);border:1px solid var(--ac);padding:11px 14px;text-decoration:none;cursor:pointer}
.info .en:active{transform:translateY(1px)}

.box.music{--ac:var(--acid)}.box.rooms{--ac:var(--cyan)}.box.shop{--ac:var(--pink)}
.box.ics{--ac:var(--gold)}.box.tv{--ac:var(--red)}.box.you{--ac:#5ad17a}

/* radio dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:60;background:linear-gradient(180deg,#0c0c0c,#070707);
  border-top:2px solid var(--acid);box-shadow:0 -10px 30px rgba(0,0,0,.6),0 -1px 0 rgba(182,255,0,.35);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.dock .row{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.disc{width:56px;height:56px;flex:none;border-radius:50%;position:relative;cursor:pointer;overflow:hidden;
  background:#000 center/cover no-repeat;border:2px solid #333;box-shadow:0 0 0 4px #0a0a0a}
.disc::after{content:"";position:absolute;inset:42% 42%;border-radius:50%;background:#0a0a0a;border:2px solid #2a2a2a}
.disc.spin{animation:vy 3.6s linear infinite}@keyframes vy{to{transform:rotate(360deg)}}
.meta{flex:1;min-width:0}
.meta .lab{font-family:var(--px);font-size:7px;letter-spacing:1px;color:var(--acid)}
.meta .ti{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.wave{display:flex;align-items:flex-end;gap:2px;height:15px;margin-top:6px}
.wave i{width:3px;background:var(--acid);opacity:.6;height:30%}
.playing .wave i{animation:eq .9s ease-in-out infinite}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.28s}.wave i:nth-child(4n){animation-delay:.08s}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
.ctrls{display:flex;align-items:center;gap:8px;flex:none}
.ctrls button{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:22px;padding:6px}
.ctrls button:hover{color:var(--ink)}
.play{width:52px;height:52px;border:2px solid var(--acid)!important;border-radius:50%;color:#07120a!important;
  background:var(--acid)!important;font-size:20px!important;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 18px rgba(182,255,0,.5)}
.play:active{transform:translateY(1px)}
.bar{max-width:1080px;margin:8px auto 0;height:4px;background:#1a1a1a;position:relative;cursor:pointer}
.bar i{position:absolute;left:0;top:0;bottom:0;width:34%;background:var(--acid);box-shadow:0 0 8px var(--acid)}
.bar i::after{content:"";position:absolute;right:-4px;top:-3px;width:9px;height:9px;border-radius:50%;background:#fff}
.tapme{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-family:var(--px);font-size:6.5px;
  letter-spacing:1px;color:#07120a;background:var(--acid);padding:3px 8px}
@media(max-width:520px){.meta .ti{font-size:19px}.disc{width:48px;height:48px}.play{width:46px;height:46px}}

#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);z-index:80;
  font-family:var(--px);font-size:9px;letter-spacing:1px;color:#07120a;background:var(--acid);padding:12px 16px;
  opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* --- BOOT: dark until you press play --- */
body.booting .top,body.booting .hello,body.booting .grid{opacity:.12;filter:saturate(.2) blur(.5px);pointer-events:none;transition:opacity .5s,filter .5s}
body.booting .disc,body.booting .meta,body.booting #prev,body.booting #next,body.booting .bar,body.booting .tapme{opacity:.16;pointer-events:none;transition:.4s}
body.booting .dock{box-shadow:none;border-top-color:#1a1a1a}
body.booting .play{animation:beckon 1.15s ease-in-out infinite;box-shadow:0 0 34px var(--acid),0 0 74px rgba(182,255,0,.6)}
@keyframes beckon{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.pressplay{position:fixed;left:0;right:0;bottom:120px;z-index:59;text-align:center;font-family:var(--px);
  font-size:9px;letter-spacing:2px;color:var(--acid);pointer-events:none;transition:.4s;text-shadow:0 0 12px rgba(182,255,0,.5)}
body:not(.booting) .pressplay{opacity:0}

/* --- REACTIVITY: things move to the music --- */
.playing .peek{transform:scale(calc(1 + var(--beat,0)*.035));transition:transform .08s linear}
.playing .box.rooms .peek{transform:scale(calc(1 + var(--beat,0)*.075)) translateY(calc(var(--beat,0)*-3px))}
.playing .box .ico{transform:translateY(calc(var(--beat,0)*-2px))}
.playing .disc{box-shadow:0 0 0 4px #0a0a0a,0 0 calc(6px + var(--beat,0)*20px) rgba(182,255,0,.55)}
.playing .hello h1{text-shadow:0 0 calc(var(--beat,0)*16px) rgba(182,255,0,.45)}

/* --- MUSIC UNIVERSE: a mini-spotify that IS the radio --- */
#uni{position:fixed;inset:0;z-index:75;background:#050506;display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#uni.on{transform:translateY(0)}
#uni .uhead{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:2px solid var(--border)}
.uback{font-family:var(--px);font-size:11px;color:var(--acid);background:none;border:none;cursor:pointer;padding:4px 6px}
.utitle{font-family:var(--px);font-size:10px;letter-spacing:1px;color:var(--ink)}
.usearch{flex:1}
.usearch input{width:100%;font-family:var(--vt);font-size:18px;background:#0e0e0e;color:var(--ink);border:1px solid var(--border);padding:9px 12px}
.usearch input:focus{outline:none;border-color:var(--acid)}
#ugrid{position:absolute;inset:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;padding:14px 14px 140px}
.ucard{cursor:pointer;border:1px solid var(--border);background:#0b0b0b;overflow:hidden;transition:.15s}
.ucard:hover{border-color:var(--acid);transform:translateY(-3px)}
.ucard .uc{width:100%;aspect-ratio:1/1;background:#000 center/cover no-repeat;position:relative}
.ucard .uc::after{content:"\25B6";position:absolute;right:6px;bottom:6px;width:20px;height:20px;line-height:20px;text-align:center;
  font-size:9px;color:#07120a;background:var(--acid);opacity:0;transition:.15s}
.ucard:hover .uc::after{opacity:1}
.ucard .un{font-family:var(--vt);font-size:16px;color:var(--ink);padding:7px 8px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ucard .ua{font-family:var(--px);font-size:6px;color:var(--dim);padding:0 8px 9px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#udet{position:absolute;inset:0;z-index:76;background:#070708;transform:translateY(100%);transition:transform .28s;display:flex;flex-direction:column;overflow-y:auto}
#udet.on{transform:translateY(0)}
#udet .dh{position:relative;height:42vh;min-height:230px;background:#000 center/cover no-repeat;flex:none}
#udet .dh::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,#070708)}
.dclose{position:absolute;top:14px;left:14px;z-index:2;font-family:var(--px);font-size:9px;color:#fff;background:rgba(0,0,0,.6);border:1px solid var(--border);padding:9px 11px;cursor:pointer}
#udet .db{padding:0 18px 140px;margin-top:-46px;position:relative;z-index:2}
#udet .dti{font-family:var(--px);font-size:15px;color:#fff;line-height:1.5}
#udet .dar{font-family:var(--px);font-size:8px;color:var(--acid);margin-top:9px;letter-spacing:1px}
#udet .dinfo{color:var(--dim);font-size:16px;margin-top:9px}
.dplay{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-family:var(--px);font-size:10px;color:#07120a;background:var(--acid);border:none;padding:13px 18px;cursor:pointer}
.dplay:active{transform:translateY(1px)}
#udet .lyr{margin-top:22px;border-top:1px solid var(--border);padding-top:16px}
.lyrh{font-family:var(--px);font-size:8px;color:var(--dim);letter-spacing:1px;margin-bottom:10px}
#dlyr{font-size:19px;line-height:1.75;color:#cfcfcf;white-space:pre-line}

/* galaxy stage inside the universe */
#unistage{flex:1;position:relative;overflow:hidden;background:#050506}
#unicv{position:absolute;inset:0;width:100%;height:100%;display:block}
.uhint{position:absolute;left:0;right:0;bottom:130px;text-align:center;font-family:var(--px);font-size:7px;letter-spacing:1px;color:var(--dim);pointer-events:none}
.utoggle{font-family:var(--px);font-size:8px;color:var(--acid);background:none;border:1px solid var(--border);padding:9px 10px;cursor:pointer;flex:none}
.utoggle:hover{border-color:var(--acid)}
#uni.listmode #unicv,#uni.listmode .uhint{display:none}
#uni:not(.listmode) #ugrid{display:none}
</style>
</head>
<body>

<div class="top">
  <span class="brand">ONLY<span class="r">IBEE</span> OS</span>
  <span class="chip coin"><span class="dt"></span>◈ 340</span>
  <span class="sp"></span>
  <span class="chip"><span class="dt"></span>SIGNAL LIVE</span>
</div>
<div class="hello"><h1>GOOD EVENING_</h1></div>

<main class="grid" id="grid">

  <button class="box music" data-ico="music" style="--img:url(https://onlyibee.com/assets/img/nouveaux-punk.jpg)">
    <div class="peek"></div>
    <span class="ico"></span>
    <span class="nm">MUSIC</span><span class="cnt">35 ▸</span>
    <div class="info"><div class="tg">THE UNIVERSE</div>
      <div class="ds">galaxies of releases — planets you can play.</div>
      <a class="en">ENTER ▶</a></div>
  </button>

  <button class="box rooms" data-ico="rooms" style="--img:url(https://onlyibee.com/arcade/covers/aqua-bass.png)">
    <div class="peek"></div>
    <span class="ico"></span>
    <span class="nm">ROOMS</span><span class="cnt">10 ▸</span>
    <div class="info"><div class="tg">VISUALIZERS</div>
      <div class="ds">creative, playable ways to hear the music.</div>
      <a class="en">ENTER ▶</a></div>
  </button>

  <button class="box shop" data-ico="shop" style="--img:url(https://static.wixstatic.com/media/0fcae7_adcaa115259d490e8398a7ac610aa9da~mv2.jpg/v1/fit/w_600,h_600,q_85/file.jpg)">
    <div class="peek"></div>
    <span class="ico"></span>
    <span class="nm">SHOP</span><span class="cnt">47 ▸</span>
    <div class="info"><div class="tg">UTOPIE · ONE OF ONE</div>
      <div class="ds">hand-made pieces. each one made only once.</div>
      <a class="en">ENTER ▶</a></div>
  </button>

  <button class="box ics" data-ico="ics" style="--img:url(https://onlyibee.com/assets/chess/queen.png)">
    <div class="peek contain"></div>
    <span class="ico"></span>
    <span class="nm">ICS</span><span class="cnt">08 ▸</span>
    <div class="info"><div class="tg">THE CREW · PROJECT 03</div>
      <div class="ds">meet the characters. play them as chess.</div>
      <a class="en">ENTER ▶</a></div>
  </button>

  <button class="box you" data-ico="you" style="--img:url(https://onlyibee.com/assets/profile%20avatars/mimi%20default%20profile%20avatar.png)">
    <div class="peek contain"></div>
    <span class="ico"></span>
    <span class="nm">YOU</span><span class="cnt">◈ 340</span>
    <div class="info"><div class="tg">CARD · RANK 04</div>
      <div class="ds">your card, your rank, your one room.</div>
      <a class="en">ENTER ▶</a></div>
  </button>

  <button class="box tv wide" data-ico="tv">
    <video class="tvvid" muted loop playsinline autoplay preload="auto"
      src="https://onlyibee.com/assets/video/radio-loop.mp4"></video>
    <div class="peek" style="background:none"></div>
    <span class="ico"></span>
    <span class="nm">TV</span><span class="cnt">▶ LIVE</span>
    <div class="info"><div class="tg">VIDEOS</div>
      <div class="ds">clips, visuals and the occasional broadcast.</div>
      <a class="en">ENTER ▶</a></div>
  </button>

</main>

<div class="pressplay">▶  PRESS PLAY TO WAKE THE CONSOLE</div>
<div id="uni">
  <div class="uhead">
    <button class="uback" id="uback">◀</button>
    <span class="utitle">THE UNIVERSE</span>
    <span class="usearch"><input id="usq" placeholder="⌕ search songs, albums, vibes…" autocomplete="off"></span>
    <button class="utoggle" id="utoggle">▦ LIST</button>
  </div>
  <div id="unistage">
    <canvas id="unicv"></canvas>
    <div id="ugrid"></div>
    <div class="uhint">a galaxy per record · a planet per song · tap one to open it</div>
  </div>
  <div id="udet">
    <div class="dh" id="dhero"><button class="dclose" id="dclose">◀ BACK</button></div>
    <div class="db">
      <div class="dti" id="dti"></div><div class="dar" id="dar"></div>
      <div class="dinfo" id="dinfo"></div>
      <button class="dplay" id="dplay">▶ PLAY</button>
      <div class="lyr"><div class="lyrh">LYRICS</div><span id="dlyr"></span></div>
    </div>
  </div>
</div>
<div class="dock" id="dock">
  <span class="tapme">TAP TO OPEN THE PLAYER</span>
  <div class="row">
    <span class="disc spin" id="disc" style="background-image:url(https://onlyibee.com/assets/img/20mzs-album.jpg)"></span>
    <div class="meta" id="meta"><div class="lab">◉ NOW PLAYING</div>
      <div class="ti" id="ti">20 MIN ZA SESSION</div><div class="wave" id="wave"></div></div>
    <div class="ctrls"><button id="prev">⏮</button><button class="play" id="play">▶</button><button id="next">⏭</button></div>
  </div>
  <div class="bar" id="bar"><i id="fill"></i></div>
</div>
<div id="toast"></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};

  /* the same rotating voxel icons the site menu uses: one SVG stacked in 6
     depth layers, back ones dimmed, spinning. ICS keeps its chess piece. */
  var SVG={
    music:"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><ellipse cx='8' cy='8' rx='7' ry='2.3' fill='none' stroke='#26e0ff' stroke-width='.7' transform='rotate(-18 8 8)'/><circle cx='8' cy='8' r='4' fill='#161616' stroke='#b6ff00' stroke-width='.7'/><circle cx='6.5' cy='6.7' r='.9' fill='#b6ff00'/><circle cx='9.4' cy='9' r='.6' fill='#ff2bd6'/><circle cx='9' cy='6.4' r='.4' fill='#26e0ff'/></svg>",
    rooms:"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M5 5 H11 C13 5 13.4 6.2 13.9 8 L14.7 11.4 C15 13.1 13.3 13.7 12.2 12.5 L10.3 10.4 H5.7 L3.8 12.5 C2.7 13.7 1 13.1 1.3 11.4 L2.1 8 C2.6 6.2 3 5 5 5 Z' fill='#161616' stroke='#26e0ff' stroke-width='.6'/><rect x='3.9' y='7.35' width='2.5' height='.8' fill='#26e0ff'/><rect x='4.75' y='6.5' width='.8' height='2.5' fill='#26e0ff'/><circle cx='11' cy='6.85' r='.55' fill='#ff2b2b'/><circle cx='12.05' cy='7.9' r='.55' fill='#b6ff00'/><circle cx='9.95' cy='7.9' r='.55' fill='#26e0ff'/><circle cx='11' cy='8.95' r='.55' fill='#ff2bd6'/></svg>",
    shop:"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M2 3 L5.2 1 L6.4 2.2 H9.6 L10.8 1 L14 3 L12.4 6.2 L11 5.2 V15 H5 V5.2 L3.6 6.2 Z' fill='#ff2bd6' stroke='#3a0030' stroke-width='.5'/><rect x='6.6' y='7' width='2.8' height='2.8' fill='#161616'/><path d='M6.4 2.2 A1.8 1.8 0 0 0 9.6 2.2' fill='#070707'/></svg>",
    tv:"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M4.4 3.1 7.2 5.4 8.8 5.4 11.6 3.1' stroke='#ff2b2b' stroke-width='.9' fill='none'/><rect x='1.5' y='5' width='13' height='9' rx='1.2' fill='#161616' stroke='#ff2b2b' stroke-width='.7'/><rect x='2.7' y='6.2' width='8.6' height='6.6' fill='#26e0ff' opacity='.85'/><rect x='2.7' y='6.2' width='8.6' height='1.1' fill='#fff' opacity='.35'/><circle cx='13' cy='7.4' r='.7' fill='#b6ff00'/></svg>",
    you:"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1.5' y='3.5' width='13' height='9' rx='1.1' fill='#161616' stroke='#5ad17a' stroke-width='.7'/><circle cx='5' cy='7' r='1.7' fill='#5ad17a'/><path d='M2.6 11.1 a2.5 2.5 0 0 1 4.8 0 Z' fill='#5ad17a'/><rect x='8.4' y='5.6' width='4.6' height='.9' fill='#b6ff00'/><rect x='8.4' y='7.5' width='4.6' height='.9' fill='#555'/><rect x='8.4' y='9.4' width='3' height='.9' fill='#555'/></svg>"
  };
  function voxel(svg){
    var w=document.createElement('span'); w.className='o3';
    var uri="data:image/svg+xml,"+encodeURIComponent(svg), z=[-3.2,-1.9,-.6,.6,1.9,3.2];
    z.forEach(function(t,i){ var im=new Image(); im.src=uri; im.alt="";
      im.style.transform='translateZ('+t+'px)'; if(i<5) im.style.filter='brightness(.42)'; w.appendChild(im); });
    return w;
  }
  [].forEach.call(document.querySelectorAll('.box'),function(bx){
    var slot=bx.querySelector('.ico'), k=bx.getAttribute('data-ico');
    if(k==='ics'){ var w=document.createElement('span'); w.className='o3';
      var im=new Image(); im.src="https://onlyibee.com/assets/chess/bishop2.png"; w.appendChild(im); slot.appendChild(w); }
    else slot.appendChild(voxel(SVG[k]||SVG.music));
  });

  function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("on");},1300); }

  /* first tap reveals the info (text) — a second tap on ENTER goes in */
  var boxes=[].slice.call(document.querySelectorAll('.box'));
  boxes.forEach(function(bx){
    bx.addEventListener('click',function(e){
      if(e.target.classList.contains('en')){ if(bx.classList.contains('music')){ openUni(); } else { toast("OPENING  "+bx.querySelector('.nm').textContent+"_"); } return; }
      var open=bx.classList.contains('sel');
      boxes.forEach(function(b){ b.classList.remove('sel'); });
      if(!open) bx.classList.add('sel');
    });
  });
  document.addEventListener('click',function(e){ if(!e.target.closest('.box')) boxes.forEach(function(b){b.classList.remove('sel');}); });

  /* radio dock */
  var wave=$("wave"); for(var i=0;i<12;i++){ var b=document.createElement('i'); b.style.height=(20+Math.random()*70)+'%'; wave.appendChild(b); }
  var TRACKS=[{t:"20 MIN ZA SESSION",a:"https://onlyibee.com/assets/img/20mzs-album.jpg"},
              {t:"NOUVEAUX PUNK — SI JAMAIS",a:"https://onlyibee.com/assets/img/nouveaux-punk.jpg"},
              {t:"NOUVEAUX PUNK — DU LOVE",a:"https://onlyibee.com/assets/img/np-cover.jpg"}];
  var idx=0, playing=true;
  function paint(){ $("ti").textContent=TRACKS[idx].t; $("disc").style.backgroundImage="url("+TRACKS[idx].a+")"; }
  function setPlay(p){ playing=p; $("play").textContent=p?"❚❚":"▶"; $("dock").classList.toggle("playing",p); $("disc").classList.toggle("spin",p); document.body.classList.toggle("playing",p); }
  $("play").onclick=function(e){e.stopPropagation(); if(document.body.classList.contains("booting")){ document.body.classList.remove("booting"); setPlay(true); return; } setPlay(!playing);};
  $("next").onclick=function(e){e.stopPropagation();idx=(idx+1)%TRACKS.length;paint();toast("NEXT ⏭");};
  $("prev").onclick=function(e){e.stopPropagation();idx=(idx-1+TRACKS.length)%TRACKS.length;paint();toast("PREV ⏮");};
  $("disc").onclick=$("meta").onclick=function(){toast("OPENING THE PLAYER_");};
  document.querySelector('.tapme').onclick=function(){toast("OPENING THE PLAYER_");};
  var pct=34; setInterval(function(){ if(!playing)return; pct+=0.4; if(pct>100)pct=0; $("fill").style.width=pct+"%"; },160);
  $("bar").onclick=function(ev){ var r=this.getBoundingClientRect(); pct=(ev.clientX-r.left)/r.width*100; $("fill").style.width=pct+"%"; };
  paint(); setPlay(false); document.body.classList.add("booting");

  /* things move to the music — a fake beat drives a --beat var while playing */
  (function loop(t){ requestAnimationFrame(loop);
    if(!document.body.classList.contains("playing")){ document.body.style.setProperty("--beat",0); return; }
    var kick=Math.pow(Math.max(0,Math.sin(t/340)),3);
    var b=kick*(0.7+0.3*Math.sin(t/1900));
    curBeat=b; document.body.style.setProperty("--beat", b.toFixed(3));
  })(0);

  /* THE UNIVERSE — a mini-spotify that is the radio: search, covers, lyrics, info */
  var NPC="https://onlyibee.com/assets/img/nouveaux-punk.jpg",
      NP2C="https://onlyibee.com/assets/img/np-cover.jpg",
      MZS="https://onlyibee.com/assets/img/20mzs-album.jpg";
  var LY="you keep moving because still is worse.\nsomebody laughed — you built a year on that.\nyou wrote it down so it would exist outside your head.\neverything true was in the gaps.";
  var SONGS=[
    {n:"SI JAMAIS",a:"NOUVEAUX PUNK",c:NPC,len:"1:46",pl:"12.4k"},
    {n:"DU LOVE",a:"NOUVEAUX PUNK",c:NP2C,len:"2:42",pl:"9.1k"},
    {n:"GET LOOSE",a:"NOUVEAUX PUNK",c:NPC,len:"3:03",pl:"7.8k"},
    {n:"TOUJOURS",a:"NOUVEAUX PUNK",c:NP2C,len:"3:37",pl:"15.2k"},
    {n:"LOST IN THE WORLD",a:"NOUVEAUX PUNK",c:NPC,len:"3:03",pl:"6.6k"},
    {n:"DANS LA STREET",a:"NOUVEAUX PUNK",c:NP2C,len:"1:50",pl:"5.0k"},
    {n:"20 MIN ZA SESSION",a:"20MZS · ONE TAKE",c:MZS,len:"20:00",pl:"22.9k"},
    {n:"CALL IT A DAY",a:"20 MIN ZA SESSION",c:MZS,len:"2:10",pl:"4.3k"},
    {n:"WISH I WAS LYING",a:"20 MIN ZA SESSION",c:MZS,len:"2:55",pl:"3.7k"},
    {n:"ON MY MIND",a:"20 MIN ZA SESSION",c:MZS,len:"4:16",pl:"8.2k"}
  ];
  function card(s,i){ return '<div class="ucard" data-i="'+i+'"><div class="uc" style="background-image:url('+s.c+')"></div>'
    +'<div class="un">'+s.n+'</div><div class="ua">'+s.a+'</div></div>'; }
  function renderUni(q){ q=(q||"").toLowerCase();
    var list=SONGS.map(function(s,i){return {s:s,i:i};}).filter(function(o){ return !q || (o.s.n+" "+o.s.a).toLowerCase().indexOf(q)>-1; });
    $("ugrid").innerHTML = list.length ? list.map(function(o){return card(o.s,o.i);}).join("")
      : '<div style="grid-column:1/-1;color:var(--dim);font-family:var(--px);font-size:9px;padding:40px 0;text-align:center">nothing here_</div>';
    [].forEach.call($("ugrid").querySelectorAll(".ucard"),function(el){ el.onclick=function(){ openDet(SONGS[+el.getAttribute("data-i")]); }; });
  }

  /* ===== THE UNIVERSE — the galaxy engine's own model, kept:
     a PICKER of spinning spiral galaxies (one per record) -> tap to ENTER a
     galaxy -> its songs drift as planets -> tap a planet to play + open its
     page. Search + LIST layer over it. Same two-level flow as console.html. */
  var GAL=[{name:"NOUVEAUX PUNK",hue:110,sub:"ROCK RNB BLUES",cv:NPC},
           {name:"20 MIN ZA SESSION",hue:78,sub:"ONE TAKE",cv:MZS}];
  GAL.forEach(function(g){ g.img=new Image(); g.img._ok=false; g.img.onload=function(){this._ok=true;}; g.img.src=g.cv; });
  SONGS.forEach(function(s){ s.g=/20 ?min|20mzs/i.test(s.a)?1:0; });
  var cv=$("unicv"), cx=cv.getContext("2d"), CW=0,CH=0,DPR=1;
  var uniOpen=false, mode="galaxy", curG=-1, gxs=[], planets=[], hoverP=null, hoverG=-1, uq="", lastT=0;
  var stars=[]; for(var k=0;k<90;k++) stars.push({x:Math.random(),y:Math.random(),z:Math.random()});
  var utitle=document.querySelector(".utitle"), uhint=document.querySelector(".uhint");

  function buildGx(){ gxs=GAL.map(function(g,i){ var arms=2+i, dots=[];
    for(var d=0;d<110;d++){ var t=(d+3)/110, arm=d%arms;
      dots.push({ang:t*Math.PI*3.4+arm*(6.283/arms), rad:t, sz:Math.random()*1.4+0.5, jit:(Math.random()-0.5)*8}); }
    return {g:g,i:i,spin:Math.random()*6.283,dots:dots,x:0,y:0,r:0,count:SONGS.filter(function(s){return s.g===i;}).length}; }); }
  function sizeCv(){ var r=$("unistage").getBoundingClientRect(); if(!r.width)return;
    CW=r.width;CH=r.height;DPR=Math.min(2,window.devicePixelRatio||1);
    cv.width=CW*DPR;cv.height=CH*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
    var R=Math.min(CW,CH)*0.19; gxs.forEach(function(gd,i){ gd.x=CW*0.5; gd.y=CH*(0.32+i*0.40); gd.r=R; }); }
  function imgCover(img,dx,dy,d){ if(!img||!img._ok)return false; var iw=img.naturalWidth,ih=img.naturalHeight,s=Math.max(d/iw,d/ih),sw=d/s,sh=d/s; cx.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,dx,dy,d,d); return true; }
  function drawStars(beat){ cx.fillStyle="#050506";cx.fillRect(0,0,CW,CH);
    stars.forEach(function(st){ st.y+=0.0003+st.z*0.0006; if(st.y>1)st.y=0;
      cx.globalAlpha=(0.15+st.z*0.5)*(0.6+beat*0.6); cx.fillStyle="#fff"; cx.fillRect(st.x*CW,st.y*CH,1.3,1.3);}); cx.globalAlpha=1; }
  function drawGalaxies(beat){ cx.textAlign="center";
    gxs.forEach(function(gd){ gd.spin+=0.0016+beat*0.003; var hue=gd.g.hue;
      var core=cx.createRadialGradient(gd.x,gd.y,0,gd.x,gd.y,gd.r);
      core.addColorStop(0,"hsla("+hue+",90%,70%,"+(0.4+beat*0.3).toFixed(3)+")");
      core.addColorStop(.3,"hsla("+hue+",80%,55%,.12)"); core.addColorStop(1,"hsla("+hue+",70%,45%,0)");
      cx.fillStyle=core; cx.beginPath(); cx.arc(gd.x,gd.y,gd.r,0,6.283); cx.fill();
      var cr=gd.r*0.52;
      cx.save(); cx.beginPath(); cx.arc(gd.x,gd.y,cr,0,6.283); cx.clip();
      if(!imgCover(gd.g.img,gd.x-cr,gd.y-cr,cr*2)){ cx.fillStyle="hsl("+hue+",70%,30%)"; cx.fillRect(gd.x-cr,gd.y-cr,cr*2,cr*2); }
      cx.globalAlpha=0.18; cx.fillStyle="hsl("+hue+",80%,50%)"; cx.fillRect(gd.x-cr,gd.y-cr,cr*2,cr*2); cx.globalAlpha=1;
      cx.restore();
      cx.strokeStyle="hsla("+hue+",90%,66%,.55)"; cx.lineWidth=1.6; cx.beginPath(); cx.arc(gd.x,gd.y,cr,0,6.283); cx.stroke();
      cx.fillStyle="#0a0a0a"; cx.beginPath(); cx.arc(gd.x,gd.y,cr*0.15,0,6.283); cx.fill();
      cx.save(); cx.translate(gd.x,gd.y); cx.rotate(gd.spin);
      gd.dots.forEach(function(dt){ var x=Math.cos(dt.ang)*dt.rad*gd.r, y=Math.sin(dt.ang)*dt.rad*gd.r*0.62+dt.jit*0.5;
        cx.globalAlpha=0.5+0.5*Math.sin(performance.now()*0.002+dt.ang*3); cx.fillStyle="hsl("+hue+",85%,72%)"; cx.fillRect(x,y,dt.sz,dt.sz); });
      cx.restore(); cx.globalAlpha=1;
      var ly=gd.y+gd.r*0.80, name=gd.g.name, sub=gd.g.sub+" · "+gd.count+" signals";
      cx.font="9px 'Press Start 2P',monospace"; var w1=cx.measureText(name).width;
      cx.font="14px VT323,monospace"; var w2=cx.measureText(sub).width; var pw=Math.max(w1,w2)+22;
      cx.fillStyle="rgba(4,4,8,.8)"; cx.fillRect(gd.x-pw/2,ly,pw,38);
      cx.strokeStyle=(hoverG===gd.i)?"hsla("+hue+",90%,62%,.65)":"rgba(255,255,255,.1)"; cx.lineWidth=1; cx.strokeRect(gd.x-pw/2,ly,pw,38);
      cx.font="9px 'Press Start 2P',monospace"; cx.fillStyle="#f2f2f2"; cx.fillText(name,gd.x,ly+15);
      cx.font="14px VT323,monospace"; cx.fillStyle="#9fa0a2"; cx.fillText(sub,gd.x,ly+31); });
  }
  function makePlanet(s,n){ var sz=n>12?9:n>8?11:15;
    return {s:s,x:40+Math.random()*(CW-80),y:90+Math.random()*(CH-230),
      vx:(Math.random()-.5)*16,vy:(Math.random()-.5)*16,ph:Math.random()*6.283,rot:Math.random()*6.283,bell:sz+Math.random()*3}; }
  function enterGalaxy(i){ mode="system"; curG=i;
    var list=SONGS.filter(function(s){return s.g===i;});
    planets=list.map(function(s){return makePlanet(s,list.length);}); setTitle(); }
  function exitGalaxies(){ mode="galaxy"; curG=-1; setTitle(); }
  function setTitle(){ if(utitle) utitle.textContent = mode==="system"?GAL[curG].name:"THE UNIVERSE";
    if(uhint) uhint.textContent = mode==="system"?"tap a record to play  ·  ◀ for the galaxies":"a galaxy per record · tap one to enter";
    $("uback").textContent = mode==="system"?"◀ GALAXIES":"◀"; }
  function drawSystem(beat,dt){ var g=GAL[curG];
    var core=cx.createRadialGradient(CW/2,CH*0.42,0,CW/2,CH*0.42,Math.max(CW,CH)*0.65);
    core.addColorStop(0,"hsla("+g.hue+",80%,50%,.06)"); core.addColorStop(1,"hsla("+g.hue+",80%,50%,0)");
    cx.fillStyle=core; cx.fillRect(0,0,CW,CH); cx.textAlign="center";
    planets.forEach(function(pl){ pl.x+=pl.vx*dt; pl.y+=pl.vy*dt; pl.ph+=dt*1.5;
      var pX=30,pT=54,pB=120;
      if(pl.x<pX){pl.x=pX;pl.vx*=-1;} if(pl.x>CW-pX){pl.x=CW-pX;pl.vx*=-1;}
      if(pl.y<pT){pl.y=pT;pl.vy*=-1;} if(pl.y>CH-pB){pl.y=CH-pB;pl.vy*=-1;}
      var match=!uq||(pl.s.n+" "+pl.s.a).toLowerCase().indexOf(uq)>-1;
      var sz=(pl.bell*0.6)*(1+beat*0.5)+Math.sin(pl.ph)*1.2, hue=g.hue;
      cx.globalAlpha=match?1:0.16;
      if(pl===hoverP){ cx.fillStyle="hsla("+hue+",90%,66%,.35)"; cx.beginPath(); cx.arc(pl.x,pl.y,sz+7,0,6.283); cx.fill(); }
      pl.rot+=dt*(playing?2.2:0.5);
      cx.save(); cx.translate(pl.x,pl.y); cx.rotate(pl.rot);
      cx.beginPath(); cx.arc(0,0,sz,0,6.283); cx.clip();
      if(!imgCover(g.img,-sz,-sz,sz*2)){ cx.fillStyle="hsl("+hue+",85%,55%)"; cx.fillRect(-sz,-sz,sz*2,sz*2); }
      cx.restore();
      cx.strokeStyle="hsl("+hue+",90%,"+(match?68:48)+"%)"; cx.lineWidth=1.4; cx.beginPath(); cx.arc(pl.x,pl.y,sz,0,6.283); cx.stroke();
      cx.fillStyle="#0a0a0a"; cx.beginPath(); cx.arc(pl.x,pl.y,sz*0.26,0,6.283); cx.fill();
      cx.strokeStyle="hsla("+hue+",60%,62%,.6)"; cx.lineWidth=1; cx.beginPath(); cx.arc(pl.x,pl.y,sz*0.26,0,6.283); cx.stroke();
      cx.globalAlpha=1;
      if(pl===hoverP||(uq&&match)){ cx.fillStyle=pl===hoverP?"#fff":"rgba(255,255,255,.75)"; cx.font="7px 'Press Start 2P',monospace"; cx.fillText(pl.s.n,pl.x,pl.y-sz-8); }
    });
  }
  function frame(t){ if(!uniOpen)return; requestAnimationFrame(frame);
    var dt=Math.min(0.05,((t-lastT)/1000)||0.016); lastT=t; var beat=curBeat;
    if(!CW){ sizeCv(); } drawStars(beat);
    if(mode==="galaxy") drawGalaxies(beat); else drawSystem(beat,dt); }
  function galaxyAt(mx,my){ for(var i=0;i<gxs.length;i++){ if(Math.hypot(mx-gxs[i].x,my-gxs[i].y)<gxs[i].r*1.05) return i; } return -1; }
  function planetAt(mx,my){ var best=null,bd=1e9; planets.forEach(function(pl){var d=Math.hypot(pl.x-mx,pl.y-my); if(d<bd){bd=d;best=pl;}}); return (best&&bd<(best.bell*0.6+16))?best:null; }
  cv.addEventListener("click",function(e){ var r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    if(mode==="galaxy"){ var gi=galaxyAt(mx,my); if(gi>=0) enterGalaxy(gi); }
    else { var pl=planetAt(mx,my); if(pl){ $("ti").textContent=pl.s.n; $("disc").style.backgroundImage="url("+pl.s.c+")"; setPlay(true); openDet(pl.s); } } });
  cv.addEventListener("mousemove",function(e){ var r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    if(mode==="galaxy"){ hoverG=galaxyAt(mx,my); cv.style.cursor=hoverG>=0?"pointer":"default"; }
    else { hoverP=planetAt(mx,my); cv.style.cursor=hoverP?"pointer":"default"; } });
  window.addEventListener("resize",function(){ if(uniOpen) sizeCv(); });

  function openDet(s){
    $("dhero").style.backgroundImage="url("+s.c+")";
    $("dti").textContent=s.n; $("dar").textContent=s.a;
    $("dinfo").textContent=s.len+"  ·  "+s.pl+" plays  ·  press ▶ to hear it";
    $("dlyr").textContent=LY; $("udet").classList.add("on");
    $("dplay").onclick=function(){ $("ti").textContent=s.n; $("disc").style.backgroundImage="url("+s.c+")"; setPlay(true); toast("NOW PLAYING  "+s.n+"_"); };
  }
  function openUni(){ $("uni").classList.add("on"); $("uni").classList.remove("listmode"); uniOpen=true; mode="galaxy"; curG=-1;
    buildGx(); setTitle(); renderUni(uq); lastT=0; setTimeout(function(){ sizeCv(); requestAnimationFrame(frame); },30); }
  function closeUni(){ uniOpen=false; $("udet").classList.remove("on"); $("uni").classList.remove("on"); }
  $("uback").onclick=function(){ if(mode==="system") exitGalaxies(); else closeUni(); };
  $("dclose").onclick=function(){ $("udet").classList.remove("on"); };
  $("usq").oninput=function(){ uq=this.value.toLowerCase(); renderUni(uq); };
  $("utoggle").onclick=function(){ var list=$("uni").classList.toggle("listmode");
    this.textContent=list?"🪐 GALAXY":"▦ LIST"; if(!list) setTimeout(sizeCv,20); else renderUni(uq); };
})();
</script>
