<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>ONLY IBEE OS — console v2 (prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070707;--ink:#e8e8e8;--dim:#7a7a7a;
  --acid:#b6ff00;--red:#ff2b2b;--cyan:#26e0ff;--pink:#ff2bd6;--gold:#ffd60a;--border:#242424;
  --px:'Press Start 2P',monospace;--vt:'VT323',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,rgba(38,224,255,.06),transparent 60%),var(--bg);
  color:var(--ink);font-family:var(--vt);font-size:20px;overflow-x:hidden;min-height:100dvh;
  display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9000;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9001;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.5) 100%)}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--border);z-index:5}
.brand{font-family:var(--px);font-size:12px;letter-spacing:1px;color:var(--acid)}.brand .r{color:var(--red)}
.top .sp{flex:1}
.chip{font-family:var(--px);font-size:8px;letter-spacing:1px;color:var(--dim);border:1px solid var(--border);
  padding:6px 8px;display:flex;align-items:center;gap:6px;background:#0a0a0a}
.chip.coin{color:var(--gold)}
.dt{width:6px;height:6px;border-radius:50%;background:var(--acid);box-shadow:0 0 7px var(--acid);animation:bl 1.4s steps(1) infinite}
.chip.coin .dt{background:var(--gold);box-shadow:0 0 7px var(--gold)}
@keyframes bl{50%{opacity:.25}}
.hello{padding:14px 16px 2px;z-index:5}
.hello h1{font-family:var(--px);font-size:12px;letter-spacing:1px;line-height:1.7}

/* the grid */
.grid{flex:1;display:grid;gap:12px;padding:12px 16px 150px;z-index:5;max-width:1080px;margin:0 auto;width:100%;
  grid-template-columns:repeat(2,1fr);align-content:start}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}

/* a box is mostly a big preview; text hides until you tap it */
.box{--ac:var(--acid);position:relative;border:2px solid var(--border);background:#0a0a0a;overflow:hidden;
  cursor:pointer;aspect-ratio:1/1;transition:transform .16s cubic-bezier(.2,.8,.2,1),border-color .16s,box-shadow .16s}
.box::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--ac);opacity:.9;z-index:4}
.box:hover,.box.sel{transform:translateY(-4px) scale(1.012);border-color:var(--ac);
  box-shadow:0 12px 34px rgba(0,0,0,.55),0 0 26px color-mix(in srgb,var(--ac) 32%,transparent);outline:none}
.box.wide{grid-column:1 / -1;aspect-ratio:auto;min-height:210px}

.peek{position:absolute;inset:0;background:#050505 center/cover no-repeat;background-image:var(--img)}
.peek::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,transparent 30%,rgba(0,0,0,.2) 55%,rgba(0,0,0,.86) 100%)}
.peek.contain{background-size:auto 74%;background-position:center 42%}
.tvvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* the rotating voxel icon — same technique as the site menu */
.ico{position:absolute;top:11px;left:11px;width:46px;height:46px;z-index:3;perspective:230px}
.box.wide .ico{width:64px;height:64px;top:14px;left:14px}
.o3{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;animation:sp 5.5s linear infinite}
.o3 img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
@keyframes sp{from{transform:rotateY(0) rotateX(8deg)}to{transform:rotateY(360deg) rotateX(8deg)}}
.box:hover .o3,.box.sel .o3{animation-duration:2.4s}

.nm{position:absolute;left:14px;bottom:12px;z-index:3;font-family:var(--px);font-size:13px;letter-spacing:1px;
  color:#fff;text-shadow:0 2px 8px #000,0 0 14px color-mix(in srgb,var(--ac) 45%,transparent)}
.box.wide .nm{font-size:16px;bottom:16px;left:18px}
.cnt{position:absolute;right:12px;bottom:13px;z-index:3;font-family:var(--px);font-size:8px;color:var(--ac);
  background:rgba(0,0,0,.55);padding:5px 7px}

/* the info panel — only when the box is tapped (before entering) */
.info{position:absolute;inset:0;z-index:5;background:linear-gradient(180deg,rgba(6,6,6,.35),rgba(6,6,6,.92));
  display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:16px 15px;overflow:hidden;
  opacity:0;pointer-events:none;transform:translateY(14px);
  transition:opacity .2s ease,transform .22s cubic-bezier(.2,.8,.2,1)}
.box.sel .info{opacity:1;pointer-events:auto;transform:translateY(0)}
.info .tg{font-family:var(--px);font-size:7px;letter-spacing:1px;color:var(--ac)}
.info .ds{color:#cfcfcf;font-size:17px;line-height:1.35}
.info .en{align-self:flex-start;margin-top:6px;font-family:var(--px);font-size:9px;letter-spacing:1px;
  color:#07120a;background:var(--ac);border:1px solid var(--ac);padding:11px 14px;text-decoration:none;cursor:pointer}
.info .en:active{transform:translateY(1px)}

.box.music{--ac:var(--acid)}.box.rooms{--ac:var(--cyan)}.box.shop{--ac:var(--pink)}
.box.ics{--ac:var(--gold)}.box.tv{--ac:var(--red)}.box.you{--ac:#5ad17a}

/* radio dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:60;background:linear-gradient(180deg,#0c0c0c,#070707);
  border-top:2px solid var(--acid);box-shadow:0 -10px 30px rgba(0,0,0,.6),0 -1px 0 rgba(182,255,0,.35);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.dock .row{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.disc{width:56px;height:56px;flex:none;border-radius:50%;position:relative;cursor:pointer;overflow:hidden;
  background:#000 center/cover no-repeat;border:2px solid #333;box-shadow:0 0 0 4px #0a0a0a}
.disc::after{content:"";position:absolute;inset:42% 42%;border-radius:50%;background:#0a0a0a;border:2px solid #2a2a2a}
.disc.spin{animation:vy 3.6s linear infinite}@keyframes vy{to{transform:rotate(360deg)}}
.meta{flex:1;min-width:0}
.meta .lab{font-family:var(--px);font-size:7px;letter-spacing:1px;color:var(--acid)}
.meta .ti{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.wave{display:flex;align-items:flex-end;gap:2px;height:15px;margin-top:6px}
.wave i{width:3px;background:var(--acid);opacity:.6;height:30%}
.playing .wave i{animation:eq .9s ease-in-out infinite}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.28s}.wave i:nth-child(4n){animation-delay:.08s}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
.ctrls{display:flex;align-items:center;gap:8px;flex:none}
.ctrls button{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:22px;padding:6px}
.ctrls button:hover{color:var(--ink)}
.play{width:52px;height:52px;border:2px solid var(--acid)!important;border-radius:50%;color:#07120a!important;
  background:var(--acid)!important;font-size:20px!important;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 18px rgba(182,255,0,.5)}
.play:active{transform:translateY(1px)}
.bar{max-width:1080px;margin:8px auto 0;height:4px;background:#1a1a1a;position:relative;cursor:pointer}
.bar i{position:absolute;left:0;top:0;bottom:0;width:34%;background:var(--acid);box-shadow:0 0 8px var(--acid)}
.bar i::after{content:"";position:absolute;right:-4px;top:-3px;width:9px;height:9px;border-radius:50%;background:#fff}
.tapme{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-family:var(--px);font-size:6.5px;
  letter-spacing:1px;color:#07120a;background:var(--acid);padding:3px 8px}
@media(max-width:520px){.meta .ti{font-size:19px}.disc{width:48px;height:48px}.play{width:46px;height:46px}}

#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);z-index:80;
  font-family:var(--px);font-size:9px;letter-spacing:1px;color:#07120a;background:var(--acid);padding:12px 16px;
  opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="top">
  <span class="brand">ONLY<span class="r">IBEE</span> OS</span>
  <span class="chip coin"><span class="dt"></span>◈ 340</span>
  <span class="sp"></span>
  <span class="chip"><span class="dt"></span>SIGNAL LIVE</span>
</div>
<div class="hello"><h1>GOOD EVENING_</h1></div>

<main class="grid" id="grid">

  <button class="box music" data-ico="music" style="--img:url(https://onlyibee.com/assets/img/nouveaux-punk.jpg)">
    <div class="peek"></div>
    <span class="ico"></span>
    <span class="nm">MUSIC</span><span class="cnt">35 ▸</span>
    <div class="info"><div class="tg">THE UNIVERSE</div>
      <div class="ds">galaxies of releases — planets you can play.</div>
      <a class="en">ENTER ▶</a></div>
  </button>

  <button class="box rooms" data-ico="rooms" style="--img:url(https://onlyibee.com/arcade/covers/aqua-bass.png)">
    <div class="peek"></div>
    <span class="ico"></span>
    <span class="nm">ROOMS</span><span class="cnt">10 ▸</span>
    <div class="info"><div class="tg">VISUALIZERS</div>
      <div class="ds">creative, playable ways to hear the music.</div>
      <a class="en">ENTER ▶</a></div>
  </button>

  <button class="box shop" data-ico="shop" style="--img:url(https://static.wixstatic.com/media/0fcae7_adcaa115259d490e8398a7ac610aa9da~mv2.jpg/v1/fit/w_600,h_600,q_85/file.jpg)">
    <div class="peek"></div>
    <span class="ico"></span>
    <span class="nm">SHOP</span><span class="cnt">47 ▸</span>
    <div class="info"><div class="tg">UTOPIE · ONE OF ONE</div>
      <div class="ds">hand-made pieces. each one made only once.</div>
      <a class="en">ENTER ▶</a></div>
  </button>

  <button class="box ics" data-ico="ics" style="--img:url(https://onlyibee.com/assets/chess/queen.png)">
    <div class="peek contain"></div>
    <span class="ico"></span>
    <span class="nm">ICS</span><span class="cnt">08 ▸</span>
    <div class="info"><div class="tg">THE CREW · PROJECT 03</div>
      <div class="ds">meet the characters. play them as chess.</div>
      <a class="en">ENTER ▶</a></div>
  </button>

  <button class="box you" data-ico="you" style="--img:url(https://onlyibee.com/assets/profile%20avatars/mimi%20default%20profile%20avatar.png)">
    <div class="peek contain"></div>
    <span class="ico"></span>
    <span class="nm">YOU</span><span class="cnt">◈ 340</span>
    <div class="info"><div class="tg">CARD · RANK 04</div>
      <div class="ds">your card, your rank, your one room.</div>
      <a class="en">ENTER ▶</a></div>
  </button>

  <button class="box tv wide" data-ico="tv">
    <video class="tvvid" muted loop playsinline autoplay preload="auto"
      src="https://onlyibee.com/assets/video/radio-loop.mp4"></video>
    <div class="peek" style="background:none"></div>
    <span class="ico"></span>
    <span class="nm">TV</span><span class="cnt">▶ LIVE</span>
    <div class="info"><div class="tg">VIDEOS</div>
      <div class="ds">clips, visuals and the occasional broadcast.</div>
      <a class="en">ENTER ▶</a></div>
  </button>

</main>

<div class="dock" id="dock">
  <span class="tapme">TAP TO OPEN THE PLAYER</span>
  <div class="row">
    <span class="disc spin" id="disc" style="background-image:url(https://onlyibee.com/assets/img/20mzs-album.jpg)"></span>
    <div class="meta" id="meta"><div class="lab">◉ NOW PLAYING</div>
      <div class="ti" id="ti">20 MIN ZA SESSION</div><div class="wave" id="wave"></div></div>
    <div class="ctrls"><button id="prev">⏮</button><button class="play" id="play">▶</button><button id="next">⏭</button></div>
  </div>
  <div class="bar" id="bar"><i id="fill"></i></div>
</div>
<div id="toast"></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};

  /* the same rotating voxel icons the site menu uses: one SVG stacked in 6
     depth layers, back ones dimmed, spinning. ICS keeps its chess piece. */
  var SVG={
    music:"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><ellipse cx='8' cy='8' rx='7' ry='2.3' fill='none' stroke='#26e0ff' stroke-width='.7' transform='rotate(-18 8 8)'/><circle cx='8' cy='8' r='4' fill='#161616' stroke='#b6ff00' stroke-width='.7'/><circle cx='6.5' cy='6.7' r='.9' fill='#b6ff00'/><circle cx='9.4' cy='9' r='.6' fill='#ff2bd6'/><circle cx='9' cy='6.4' r='.4' fill='#26e0ff'/></svg>",
    rooms:"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M5 5 H11 C13 5 13.4 6.2 13.9 8 L14.7 11.4 C15 13.1 13.3 13.7 12.2 12.5 L10.3 10.4 H5.7 L3.8 12.5 C2.7 13.7 1 13.1 1.3 11.4 L2.1 8 C2.6 6.2 3 5 5 5 Z' fill='#161616' stroke='#26e0ff' stroke-width='.6'/><rect x='3.9' y='7.35' width='2.5' height='.8' fill='#26e0ff'/><rect x='4.75' y='6.5' width='.8' height='2.5' fill='#26e0ff'/><circle cx='11' cy='6.85' r='.55' fill='#ff2b2b'/><circle cx='12.05' cy='7.9' r='.55' fill='#b6ff00'/><circle cx='9.95' cy='7.9' r='.55' fill='#26e0ff'/><circle cx='11' cy='8.95' r='.55' fill='#ff2bd6'/></svg>",
    shop:"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M2 3 L5.2 1 L6.4 2.2 H9.6 L10.8 1 L14 3 L12.4 6.2 L11 5.2 V15 H5 V5.2 L3.6 6.2 Z' fill='#ff2bd6' stroke='#3a0030' stroke-width='.5'/><rect x='6.6' y='7' width='2.8' height='2.8' fill='#161616'/><path d='M6.4 2.2 A1.8 1.8 0 0 0 9.6 2.2' fill='#070707'/></svg>",
    tv:"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M4.4 3.1 7.2 5.4 8.8 5.4 11.6 3.1' stroke='#ff2b2b' stroke-width='.9' fill='none'/><rect x='1.5' y='5' width='13' height='9' rx='1.2' fill='#161616' stroke='#ff2b2b' stroke-width='.7'/><rect x='2.7' y='6.2' width='8.6' height='6.6' fill='#26e0ff' opacity='.85'/><rect x='2.7' y='6.2' width='8.6' height='1.1' fill='#fff' opacity='.35'/><circle cx='13' cy='7.4' r='.7' fill='#b6ff00'/></svg>",
    you:"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1.5' y='3.5' width='13' height='9' rx='1.1' fill='#161616' stroke='#5ad17a' stroke-width='.7'/><circle cx='5' cy='7' r='1.7' fill='#5ad17a'/><path d='M2.6 11.1 a2.5 2.5 0 0 1 4.8 0 Z' fill='#5ad17a'/><rect x='8.4' y='5.6' width='4.6' height='.9' fill='#b6ff00'/><rect x='8.4' y='7.5' width='4.6' height='.9' fill='#555'/><rect x='8.4' y='9.4' width='3' height='.9' fill='#555'/></svg>"
  };
  function voxel(svg){
    var w=document.createElement('span'); w.className='o3';
    var uri="data:image/svg+xml,"+encodeURIComponent(svg), z=[-3.2,-1.9,-.6,.6,1.9,3.2];
    z.forEach(function(t,i){ var im=new Image(); im.src=uri; im.alt="";
      im.style.transform='translateZ('+t+'px)'; if(i<5) im.style.filter='brightness(.42)'; w.appendChild(im); });
    return w;
  }
  [].forEach.call(document.querySelectorAll('.box'),function(bx){
    var slot=bx.querySelector('.ico'), k=bx.getAttribute('data-ico');
    if(k==='ics'){ var w=document.createElement('span'); w.className='o3';
      var im=new Image(); im.src="https://onlyibee.com/assets/chess/bishop2.png"; w.appendChild(im); slot.appendChild(w); }
    else slot.appendChild(voxel(SVG[k]||SVG.music));
  });

  function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("on");},1300); }

  /* first tap reveals the info (text) — a second tap on ENTER goes in */
  var boxes=[].slice.call(document.querySelectorAll('.box'));
  boxes.forEach(function(bx){
    bx.addEventListener('click',function(e){
      if(e.target.classList.contains('en')){ toast("OPENING  "+bx.querySelector('.nm').textContent+"_"); return; }
      var open=bx.classList.contains('sel');
      boxes.forEach(function(b){ b.classList.remove('sel'); });
      if(!open) bx.classList.add('sel');
    });
  });
  document.addEventListener('click',function(e){ if(!e.target.closest('.box')) boxes.forEach(function(b){b.classList.remove('sel');}); });

  /* radio dock */
  var wave=$("wave"); for(var i=0;i<12;i++){ var b=document.createElement('i'); b.style.height=(20+Math.random()*70)+'%'; wave.appendChild(b); }
  var TRACKS=[{t:"20 MIN ZA SESSION",a:"https://onlyibee.com/assets/img/20mzs-album.jpg"},
              {t:"NOUVEAUX PUNK — SI JAMAIS",a:"https://onlyibee.com/assets/img/nouveaux-punk.jpg"},
              {t:"NOUVEAUX PUNK — DU LOVE",a:"https://onlyibee.com/assets/img/np-cover.jpg"}];
  var idx=0, playing=true;
  function paint(){ $("ti").textContent=TRACKS[idx].t; $("disc").style.backgroundImage="url("+TRACKS[idx].a+")"; }
  function setPlay(p){ playing=p; $("play").textContent=p?"❚❚":"▶"; $("dock").classList.toggle("playing",p); $("disc").classList.toggle("spin",p); }
  $("play").onclick=function(e){e.stopPropagation();setPlay(!playing);};
  $("next").onclick=function(e){e.stopPropagation();idx=(idx+1)%TRACKS.length;paint();toast("NEXT ⏭");};
  $("prev").onclick=function(e){e.stopPropagation();idx=(idx-1+TRACKS.length)%TRACKS.length;paint();toast("PREV ⏮");};
  $("disc").onclick=$("meta").onclick=function(){toast("OPENING THE PLAYER_");};
  document.querySelector('.tapme').onclick=function(){toast("OPENING THE PLAYER_");};
  var pct=34; setInterval(function(){ if(!playing)return; pct+=0.4; if(pct>100)pct=0; $("fill").style.width=pct+"%"; },160);
  $("bar").onclick=function(ev){ var r=this.getBoundingClientRect(); pct=(ev.clientX-r.left)/r.width*100; $("fill").style.width=pct+"%"; };
  paint(); setPlay(true);
})();
</script>
</body>
</html>
