<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-label="THE FALL — NP2">
  <!-- The room's palette: NP2 teal + neon pink + acid yellow. A stick figure
       tumbles down a channel of walls closing behind it. -->
  <defs>
    <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1719"/>
      <stop offset="1" stop-color="#1a2d31"/>
    </linearGradient>
    <linearGradient id="pit" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#040608" stop-opacity="1"/>
      <stop offset="1" stop-color="#0b1719" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="360" height="480" fill="url(#g)"/>
  <!-- gates falling past -->
  <g stroke="#ff1f6f" stroke-width="2" opacity=".55" fill="none">
    <path d="M60 60 H140 M220 60 H300"/>
    <path d="M40 130 H130 M240 130 H320"/>
    <path d="M70 200 H150 M210 200 H290"/>
    <path d="M40 330 H120 M230 330 H320"/>
    <path d="M60 400 H160 M210 400 H300"/>
  </g>
  <!-- side walls with a channel -->
  <path d="M0,0 L120,0 C180,120 100,240 160,360 C170,420 40,460 0,480 Z"
        fill="#0b1719" opacity=".92"/>
  <path d="M360,0 L240,0 C180,120 260,240 200,360 C190,420 320,460 360,480 Z"
        fill="#0b1719" opacity=".92"/>
  <rect x="0" y="360" width="360" height="120" fill="url(#pit)"/>
  <!-- the figure, upside down while falling -->
  <g stroke="#e8dc12" stroke-width="3" fill="none" transform="translate(180 240)">
    <circle cx="0" cy="8" r="6" fill="#e8dc12"/>
    <line x1="0" y1="14" x2="0" y2="-14"/>
    <line x1="-10" y1="0" x2="10" y2="0"/>
    <line x1="-8" y1="-22" x2="0" y2="-14"/>
    <line x1="8" y1="-22" x2="0" y2="-14"/>
  </g>
  <!-- wordmark -->
  <g font-family="Press Start 2P, monospace" fill="#e8dc12">
    <text x="180" y="60" text-anchor="middle" font-size="34" fill="#ff1f6f" letter-spacing="4">THE FALL</text>
    <text x="180" y="450" text-anchor="middle" font-size="9" letter-spacing="2">NP2 — 26 SONGS · ONE PIT</text>
  </g>
</svg>
