<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IBEE TV — ONLYIBEE</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#070707">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<!--
  IBEE TV — a retro set that plays the "ibee tv" YouTube playlist
  (youtube.com/playlist?list=PLeMZDG5P8Kko).
  CHANNELS below is the whole programming grid: {id: youtube video id, t: title}.
  To add a channel: drop one line in. CH ▲/▼ zaps with static; the dial at the
  bottom jumps straight to a channel. Selecting a channel pauses the site radio
  (one soundtrack at a time). Nothing autoplays on load — the set boots to static.
-->
<style>
  :root{--bg:#070707;--panel:#0e0e0e;--ink:#e8e8e8;--dim:#7a7a7a;--acid:#b6ff00;--red:#ff2b2b;--cyan:#26e0ff;
    --border:#2a2a2a;--px:'Press Start 2P',monospace;--vt:'VT323',monospace}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--vt)}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5))}
  header{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;
    border-bottom:2px solid var(--border);font-family:var(--px);font-size:10px;position:relative;z-index:50}
  header a{color:var(--acid);text-decoration:none}
  header a .r{color:var(--red)}
  header .back{color:var(--dim);font-size:9px}
  header .back:hover{color:var(--acid)}
  main{max-width:940px;margin:0 auto;padding:22px 14px 60px;position:relative;z-index:2}

  /* ===== the set ===== */
  #set{background:linear-gradient(180deg,#15120d,#0c0a07);border:3px solid #241f16;border-radius:14px;
    padding:16px 16px 12px;box-shadow:0 18px 50px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05)}
  #screenwrap{position:relative;background:#000;border:3px solid #000;border-radius:8px;overflow:hidden;
    box-shadow:inset 0 0 40px rgba(0,0,0,.9),0 0 26px rgba(182,255,0,.07)}
  #screen{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  #yt{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  /* the local channel shares the tube with the embed; only one is ever shown */
  #tvv{position:absolute;inset:0;width:100%;height:100%;display:none;object-fit:cover;background:#000}
  #tvv.on{display:block}
  #unmute{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:7;cursor:pointer;
    font-family:var(--px);font-size:8px;letter-spacing:1.5px;color:#0a0a0a;background:var(--acid);
    border:0;padding:9px 14px;box-shadow:0 0 18px rgba(182,255,0,.45)}
  #unmute:hover{background:#c9ff33}
  #unmute[hidden]{display:none}
  /* pause sits opposite the sound button, on the same line of the glass */
  #tvpause{position:absolute;left:12px;bottom:36px;z-index:7;cursor:pointer;
    font-family:var(--px);font-size:11px;line-height:1;padding:9px 11px;
    background:#0b0c0e;border:1px solid #2a2a2a;color:#b6ff00}
  #tvpause:hover{border-color:#b6ff00}
  #tvpause[hidden]{display:none}
  #static{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:3}
  #static.off{display:none}
  /* CRT face over the tube */
  #screenwrap::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
  #screenwrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
    background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55))}
  #osd{position:absolute;top:10px;right:14px;z-index:7;font-family:var(--px);font-size:13px;color:var(--acid);
    text-shadow:0 0 10px rgba(182,255,0,.8);opacity:0;transition:opacity .25s;pointer-events:none}
  #osd.on{opacity:1}
  #hint{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;
    font-family:var(--px);color:var(--acid);font-size:clamp(10px,2.6vw,14px);text-align:center;pointer-events:none;
    text-shadow:0 0 12px rgba(182,255,0,.6)}
  #hint .blink{animation:bk 1.1s steps(1) infinite}
  /* the set used to read "NO SIGNAL", which made people think it was broken.
     It's an invitation now: one button that drops you on a random transmission. */
  /* #hint is pointer-events:none (it was decorative "NO SIGNAL" text over the
     tube). A button inside it inherits that and can never be clicked — re-enable
     pointer events on the button itself, and only on the button. */
  #pressbtn{pointer-events:auto;font-family:var(--px);font-size:clamp(13px,3.4vw,20px);letter-spacing:3px;
    color:#0a0a0a;background:var(--acid);border:0;padding:16px 30px;cursor:pointer;
    box-shadow:0 0 0 3px rgba(182,255,0,.25),0 0 26px rgba(182,255,0,.55);
    animation:presspulse 1.9s ease-in-out infinite}
  #pressbtn:hover{background:#c9ff33;box-shadow:0 0 0 4px rgba(182,255,0,.35),0 0 40px rgba(182,255,0,.8)}
  #pressbtn:active{transform:translateY(2px)}
  @keyframes presspulse{0%,100%{box-shadow:0 0 0 3px rgba(182,255,0,.22),0 0 20px rgba(182,255,0,.45)}
    50%{box-shadow:0 0 0 5px rgba(182,255,0,.33),0 0 36px rgba(182,255,0,.75)}}
  #hint .ph{font-family:var(--px);font-size:8px;color:var(--dim);letter-spacing:2px}
  /* view counts on the dial */
  .ch .vw{font-family:var(--px);font-size:7px;color:#555;flex:none;margin-left:auto;white-space:nowrap}
  .ch.now .vw{color:var(--acid)}
  @keyframes bk{50%{opacity:0}}

  /* control deck under the tube */
  #deck{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px 4px}
  #brandplate{font-family:var(--px);font-size:9px;color:#6b5f43;letter-spacing:2px}
  #brandplate b{color:#8f8058;font-weight:normal}
  .knobs{display:flex;gap:8px}
  .knobs button{font-family:var(--px);font-size:10px;padding:12px 14px;background:#171310;color:var(--ink);
    border:1px solid #33291c;border-radius:6px;cursor:pointer}
  .knobs button:hover{border-color:var(--acid);color:var(--acid)}
  #chnow{font-family:var(--px);font-size:9px;color:var(--dim);min-width:90px;text-align:center}
  #chnow b{color:var(--acid);font-weight:normal}

  /* ===== programming dial (the other choices) ===== */
  #dial{margin-top:20px}
  #dial .dh{font-family:var(--px);font-size:9px;color:var(--acid);margin-bottom:10px}
  #chans{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;max-height:290px;overflow-y:auto;
    border:1px solid var(--border);padding:10px;background:rgba(10,10,10,.6)}
  .ch{display:flex;gap:9px;align-items:center;background:var(--panel);border:1px solid var(--border);
    padding:9px 10px;cursor:pointer;color:var(--dim);font-size:17px;text-align:left}
  .ch:hover{border-color:var(--acid);color:var(--ink)}
  .ch.now{border-color:var(--acid);color:var(--acid);background:#0d1400}
  .ch .no{font-family:var(--px);font-size:8px;color:#555;flex:none;width:26px}
  .ch.now .no{color:var(--acid)}
  .ch .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note{color:var(--dim);text-align:center;margin-top:14px;font-size:16px}
  .note a{color:var(--cyan)}

.mback{display:inline-block;font-family:'Press Start 2P',monospace;font-size:9px;color:#7a7a7a;text-decoration:none;border:1px solid #2a2a2a;padding:8px 12px;margin:0 0 14px 18px;position:relative;z-index:60;cursor:pointer}
.mback:hover{color:#b6ff00;border-color:#b6ff00}

  /* Fullscreen applies to #screenwrap, so the <iframe> is never re-created and
     playback survives entering AND leaving. Reassigning yt.src here would reload
     the embed and stop the video, which is exactly the bug this avoids. */
  #tvfs{position:absolute;right:10px;top:10px;z-index:30;width:34px;height:34px;
    font-size:15px;line-height:1;cursor:pointer;color:var(--acid,#b6ff00);
    background:rgba(0,0,0,.62);border:1px solid rgba(182,255,0,.5);border-radius:6px}
  #tvfs:hover{background:rgba(182,255,0,.16);border-color:#b6ff00}
  /* the fallback when the browser refuses a real fullscreen (iOS on a div) */
  #screenwrap.faux{position:fixed;inset:0;z-index:99998;border-radius:0;border:0;
    background:#000;display:flex;align-items:center;justify-content:center}
  #screenwrap.faux #screen{width:100%;height:100%;max-width:none;border:0}
  #screenwrap.faux #tvfs{right:16px;top:calc(16px + env(safe-area-inset-top))}
  /* ---- the scrub bar: our own channels can be moved through ---- */
  #tvseek{position:absolute;left:0;right:0;bottom:0;z-index:8;height:26px;
    display:flex;align-items:flex-end;cursor:pointer;touch-action:none}
  #tvseek[hidden]{display:none}
  #tvseek .tk{position:relative;width:100%;height:5px;background:rgba(255,255,255,.18)}
  #tvseek .fl{position:absolute;left:0;top:0;bottom:0;width:0;background:#b6ff00;
    box-shadow:0 0 10px rgba(182,255,0,.7)}
  #tvseek .kn{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;
    background:#b6ff00;transform:translate(-50%,-50%);box-shadow:0 0 10px rgba(182,255,0,.8)}
  #tvtime{position:absolute;right:12px;bottom:32px;z-index:8;font-family:var(--px);
    font-size:8px;color:#b6ff00;text-shadow:0 0 8px rgba(0,0,0,.9);pointer-events:none}
  #tvtime[hidden]{display:none}
  #screenwrap:fullscreen{background:#000;display:flex;align-items:center;justify-content:center}
  #screenwrap:fullscreen #screen{width:100%;height:100%;max-width:none;border:0}
  #screenwrap:fullscreen #tvfs{right:16px;top:16px}
</style>
</head>
<body>
<header>
  <a href="../console.html#menu" data-home>ONLY<span class="r">IBEE</span>&nbsp;TV</a>
</header>
<main>
<a class="mback" href="../console.html#menu" data-back data-back-only="menu">◀ BACK</a>

  <div id="set">
    <div id="screenwrap">
      <button id="tvfs" title="fullscreen">⛶</button>
      <div id="screen">
        <iframe id="yt" title="IBEE TV" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
        <!-- CH 01 is ours, not YouTube: a self-hosted clip that plays the moment
             the set switches on. Muted, because that is the only autoplay a
             browser allows — #unmute turns the sound on. -->
        <video id="tvv" loop muted playsinline preload="auto"></video>
        <canvas id="static"></canvas>
        <div id="hint"><button id="pressbtn" type="button">PRESS</button><span class="ph">a random transmission_</span></div>
        <button id="unmute" type="button" hidden>&#128266; TAP FOR SOUND</button>
        <!-- our own channels can be stopped; a YouTube channel has its own controls -->
        <button id="tvpause" type="button" hidden aria-label="Pause">&#10074;&#10074;</button>
        <!-- scrub through our own channels; a YouTube channel has its own bar -->
        <span id="tvtime" hidden>0:00 / 0:00</span>
        <div id="tvseek" hidden role="slider" aria-label="Seek" tabindex="0">
          <span class="tk"><span class="fl" id="tvfl"></span><span class="kn" id="tvkn"></span></span>
        </div>
        <span id="osd">CH 01</span>
      </div>
    </div>
    <div id="deck">
      <span id="brandplate">IBEE<b>TRON</b> 2000</span>
      <span id="chnow">CH <b id="chN">--</b></span>
      <div class="knobs">
        <button id="chup">CH ▲</button>
        <button id="chdn">CH ▼</button>
      </div>
    </div>
  </div>

  <div id="dial">
    <div class="dh">PROGRAMMING_ pick a channel</div>
    <div id="chans"></div>
    <div class="note">broadcasting the <a href="https://www.youtube.com/playlist?list=PLeMZDG5P8Kko" target="_blank" rel="noopener">ibee tv</a> playlist — new transmissions land here first_</div>
  </div>
</main>

<script src="../assets/player.js?v=36"></script>
<script>
(function(){
"use strict";
/* ===== THE PROGRAMMING GRID — mirrors the "ibee tv" YouTube playlist
   (youtube.com/playlist?list=PLeMZDG5P8Kko). Add a video to the playlist,
   then add its line here (same order). ===== */
var CHANNELS=[
  /* A channel is either a YouTube {id} or a self-hosted {src}. This one is the
     set's default transmission — it starts on load so the tube is never dead. */
  {src:"/assets/video/np2-teaser.mp4", t:"NOUVEAUX PUNK 2 \u2014 TEASER"},
  /* the sessions behind NOUVEAUX PUNK 2 — self-hosted, so they play without
     handing the viewer to YouTube. Posters mean the tube shows a frame before
     a byte of video is fetched. */
  {src:"/assets/video/np2-deranger.mp4", poster:"/assets/video/np2-deranger.jpg", t:"DERANGER \u2014 NP2"},
  {src:"/assets/video/np2-film.mp4",     poster:"/assets/video/np2-film.jpg",     t:"NP2 \u2014 THE FILM"},
  {src:"/assets/video/np2-1019.mp4",     poster:"/assets/video/np2-1019.jpg",     t:"NP2 \u2014 SESSION 10.19"},
  {src:"/assets/video/np2-1022.mp4",     poster:"/assets/video/np2-1022.jpg",     t:"NP2 \u2014 SESSION 10.22"},
  {src:"/assets/video/np2-1016.mp4",     poster:"/assets/video/np2-1016.jpg",     t:"NP2 \u2014 SESSION 10.16"},
  {id:"-M646sfdyiw", t:"ALL I SEE"},
  {id:"rA6zb4bp-sE", t:"PIQUÉ"},
  {id:"FW8eWeDuHBk", t:"DEUSPI"},
  {id:"XqtNamsfJdA", t:"UN MILI"},
  {id:"VPWyQjn_CTk", t:"BIZAR"},
  {id:"MXjQCg9cCwk", t:"NO BE SMALL TALK FAM (x G SALTE)"},
  {id:"jh14yYWViLw", t:"NICE DAY — FREESTYLE"},
  {id:"YA93_x4JarY", t:"YUUUR ft. G SALTE"},
  {id:"IF-13ZZ7PpQ", t:"UN RENOI — FREESTYLE"},
  {id:"OObk2aBgIjQ", t:"ALL IM SAYIN"},
  {id:"f8bar-0NK10", t:"OUTTA POCKET ft. KARMA SUTRA"},
  {id:"MaCk7vngdrA", t:"20 MIN ZA SESSION"},
  {id:"7F42hEzB44M", t:"TOUJOURS / JE NE REGRETTE RIEN"},
  {id:"T1e6cesSEpg", t:"DANS LA STREET"}
];

var yt=document.getElementById("yt"), st=document.getElementById("static"),
    osd=document.getElementById("osd"), hint=document.getElementById("hint"),
    chN=document.getElementById("chN"), chans=document.getElementById("chans"),
    tvv=document.getElementById("tvv"), unmute=document.getElementById("unmute");
var cur=-1, staticT=null, noiseOn=true;
/* Sound stays off until the viewer asks for it, and then stays on for the rest
   of the visit. It is also what decides whether the TV takes the radio over:
   a silent clip and the radio can share the room, a loud one cannot. */
var tvSound=false;
function isLocal(c){ return !!(c && c.src); }

/* ---- static noise (the tube between channels) ---- */
var sctx=st.getContext("2d");
function sizeStatic(){ st.width=st.clientWidth/2; st.height=st.clientHeight/2; }
sizeStatic(); addEventListener("resize",sizeStatic);
(function noise(){
  requestAnimationFrame(noise);
  if(!noiseOn)return;
  var w=st.width,h=st.height;if(!w||!h)return;
  var img=sctx.createImageData(w,h),d=img.data;
  for(var i=0;i<d.length;i+=4){var v=(Math.random()*255)|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
  sctx.putImageData(img,0,0);
  /* rolling bar */
  sctx.fillStyle="rgba(0,0,0,.35)";
  sctx.fillRect(0,(performance.now()/12)%h,w,h*0.08);
})();

/* ---- view counts ----------------------------------------------------------
   YouTube only gives real statistics through the Data API, which needs a key.
   Put a browser key restricted to onlyibee.com in YT_KEY and every channel
   shows its live count; leave it empty and the dial simply shows nothing (or a
   hand-written `views:` number on a CHANNELS entry). Never a fake number. */
var YT_KEY="";                     /* <-- paste a YouTube Data API v3 key here */

function fmtViews(n){
  n=+n||0;
  if(n>=1e9) return (n/1e9).toFixed(n<1e10?1:0).replace(/\.0$/,'')+"B VIEWS";
  if(n>=1e6) return (n/1e6).toFixed(n<1e7?1:0).replace(/\.0$/,'')+"M VIEWS";
  if(n>=1e3) return (n/1e3).toFixed(n<1e4?1:0).replace(/\.0$/,'')+"K VIEWS";
  return n+" VIEWS";
}
function loadViews(){
  if(!YT_KEY) return;                                  /* no key -> stay quiet */
  /* local channels have no YouTube id — asking about them returns nothing and
     an empty id in the list would break the comma-joined query */
  var ids=CHANNELS.map(function(c){return c.id;}).filter(Boolean);
  if(!ids.length) return;
  /* the API takes up to 50 ids per call — one request covers the whole grid */
  for(var i=0;i<ids.length;i+=50){
    (function(batch){
      fetch("https://www.googleapis.com/youtube/v3/videos?part=statistics&id="
            +batch.join(",")+"&key="+encodeURIComponent(YT_KEY))
        .then(function(r){ return r.ok?r.json():null; })
        .then(function(d){
          if(!d||!d.items) return;
          d.items.forEach(function(it){
            var el=document.querySelector('[data-vw="'+it.id+'"]');
            if(el&&it.statistics&&it.statistics.viewCount) el.textContent=fmtViews(it.statistics.viewCount);
          });
        }).catch(function(){});
    })(ids.slice(i,i+50));
  }
}

/* ---- channel list ---- */
CHANNELS.forEach(function(c,i){
  var d=document.createElement("div");d.className="ch";
  d.innerHTML='<span class="no">'+String(i+1).padStart(2,"0")+'</span><span class="tt">'+c.t+'</span>'
    +'<span class="vw" data-vw="'+(c.id||"")+'">'+(c.views?fmtViews(c.views):(isLocal(c)?'OURS':''))+'</span>';
  d.onclick=function(){tune(i);};
  chans.appendChild(d);
});
/* PRESS: drop the viewer straight onto a random transmission. Picking at random
   from the whole grid is the point — this is a TV, not a playlist. */
var pressbtn=document.getElementById("pressbtn");
if(pressbtn) pressbtn.onclick=function(){
  var i=Math.floor(Math.random()*CHANNELS.length);
  if(CHANNELS.length>1 && i===cur) i=(i+1)%CHANNELS.length;
  tune(i);
};

function markList(){
  var rows=chans.children;
  for(var i=0;i<rows.length;i++)rows[i].classList.toggle("now",i===cur);
}

loadViews();

/* ---- tune: static burst → swap the feed ---- */
function hushRadio(){
  try{var r=window.IBEERADIO||(window.top&&window.top.IBEERADIO);
    if(r&&r.playing&&r.playing())r.control.pause();}catch(e){}
}
function tune(i,opts){
  opts=opts||{};
  cur=((i%CHANNELS.length)+CHANNELS.length)%CHANNELS.length;
  var c=CHANNELS[cur], local=isLocal(c);
  /* One soundtrack at a time: the TV takes over from the radio. A MUTED local
     channel is the exception — on load it must not reach over and stop someone's
     music, so it only claims the room once the sound is actually on. */
  if(!local || tvSound) hushRadio();
  hint.style.display="none";
  noiseOn=true; st.classList.remove("off");
  osd.textContent="CH "+String(cur+1).padStart(2,"0"); osd.classList.add("on");
  chN.textContent=String(cur+1).padStart(2,"0");
  markList();
  clearTimeout(staticT);

  if(local){
    /* kill the embed outright — a blanked-but-loaded YouTube player keeps its
       audio going behind our clip */
    if(yt.src) yt.removeAttribute("src");
    /* the channel's own still, so the tube shows the shot while the clip is
       still arriving instead of a black rectangle */
    if(c.poster) tvv.setAttribute("poster", c.poster); else tvv.removeAttribute("poster");
    if(tvv.getAttribute("src")!==c.src) tvv.src=c.src;
    tvv.muted=!tvSound;
    tvv.classList.add("on");
    var p=tvv.play();
    if(p&&p.catch) p.catch(function(){
      /* autoplay refused even muted (rare, and some lock-down settings): fall
         back to the invitation rather than a dead tube */
      noiseOn=true; st.classList.remove("off"); hint.style.display="";
    });
    unmute.hidden = tvSound;
    tvpause.hidden = false;
    seek.hidden=false; seekT.hidden=false; paintSeek();
  }else{
    tvv.classList.remove("on");
    try{ tvv.pause(); }catch(e){}
    unmute.hidden=true;
    tvpause.hidden=true;
    seek.hidden=true; seekT.hidden=true;
    yt.src="https://www.youtube-nocookie.com/embed/"+c.id+"?autoplay=1&playsinline=1&rel=0&color=white&enablejsapi=1";
  }

  staticT=setTimeout(function(){
    noiseOn=false; st.classList.add("off");
    setTimeout(function(){osd.classList.remove("on");},1400);
  },650);
}
/* ---- PAUSE, and one soundtrack at a time ----
   hushRadio() used to be called only when a channel was TUNED. Nothing stopped
   the visitor starting the site radio afterwards, and then the record and the
   transmission played over each other. The clip itself is the signal now: every
   time it starts, the radio stands down. */
var tvpause=document.getElementById("tvpause");
function paintPause(){
  tvpause.innerHTML = tvv.paused ? "&#9658;" : "&#10074;&#10074;";
  tvpause.setAttribute("aria-label", tvv.paused ? "Play" : "Pause");
}
function togglePlay(){
  if(tvv.paused){ var p=tvv.play(); if(p&&p.catch) p.catch(function(){}); }
  else tvv.pause();
  paintPause();
}
tvpause.onclick=function(e){ e.preventDefault(); e.stopPropagation(); togglePlay(); };
/* the picture is the other, bigger button */
tvv.addEventListener("click",function(e){ e.stopPropagation(); togglePlay(); });
tvv.addEventListener("play", function(){ paintPause(); if(!tvv.muted) hushRadio(); });
tvv.addEventListener("pause",function(){ paintPause(); });
/* The radio silences the channel itself (player.js mutes every other video when
   a track starts), so the set hears about it from the element rather than from
   whoever did it — and offers the sound back. */
tvv.addEventListener("volumechange",function(){
  if(tvv.muted && tvSound){ tvSound=false; if(tvv.classList.contains("on")) unmute.hidden=false; }
  else if(!tvv.muted && !tvSound){ tvSound=true; unmute.hidden=true; }
});
/* NEVER TWO SOUNDS AT ONCE, and the thing the visitor JUST started is the one
   that wins. Start a channel -> the radio stands down (the "play" handler
   above). Start the radio -> the transmission goes quiet, but keeps its
   picture: a silent channel and the radio have always been allowed to share
   the room, so this drops it back to exactly that state and offers the sound
   button again. */
function hushTV(){
  if(tvv.muted) return;
  var wasPlaying = !tvv.paused;
  tvv.muted=true; tvSound=false;
  if(tvv.classList.contains("on")) unmute.hidden=false;
  /* Losing the voice must not cost the picture. The pause, when it happens, is
     ASYNCHRONOUS — checking tvv.paused on this same tick always said "still
     playing" and the resume never ran, so the channel went dark a moment later.
     Look again after the engine has settled. */
  paintPause();
  if(wasPlaying) setTimeout(function(){
    if(tvv.paused && tvv.classList.contains("on")){
      var p=tvv.play(); if(p&&p.catch) p.catch(function(){});
    }
    paintPause();
  },150);
}
(function watchRadio(t){
  t=t||0;
  try{
    var _r=window.IBEERADIO||(window.top&&window.top.IBEERADIO);
    if(_r&&_r.audio){
      /* A "play" event is not proof of sound: the radio fires one while trying
         to resume a track it then fails to load, and that was silencing the TV
         with nothing audible on the other side. Confirm it is really running. */
      _r.audio.addEventListener("play",function(){
        setTimeout(function(){
          try{ if(_r.playing&&_r.playing()&&!_r.audio.paused) hushTV(); }catch(e){}
        },60);
      });
      return;
    }
  }catch(e){}
  if(t<40) setTimeout(function(){ watchRadio(t+1); },250);   /* player.js may still be booting */
})();

/* ---- SCRUB THROUGH OUR OWN CHANNELS ----
   A channel used to be something you could only watch from wherever it happened
   to be. The bar is the clip's position and a handle you can drag anywhere in
   it; pointer capture means the drag keeps working past the edge of the bar. */
var seek=document.getElementById("tvseek"), seekFl=document.getElementById("tvfl"),
    seekKn=document.getElementById("tvkn"), seekT=document.getElementById("tvtime"),
    scrubbing=false;
function clock(s){ s=Math.max(0,s|0); return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2); }
function paintSeek(){
  var d=tvv.duration;
  if(!d || !isFinite(d)){ seekFl.style.width="0%"; seekKn.style.left="0%"; return; }
  var pct=Math.min(100,Math.max(0,(tvv.currentTime/d)*100));
  seekFl.style.width=pct+"%"; seekKn.style.left=pct+"%";
  seekT.textContent=clock(tvv.currentTime)+" / "+clock(d);
}
function seekTo(ev){
  var d=tvv.duration; if(!d||!isFinite(d)) return;
  var r=seek.getBoundingClientRect();
  var x=Math.min(r.right,Math.max(r.left,ev.clientX));
  tvv.currentTime=((x-r.left)/r.width)*d;
  paintSeek();
}
seek.addEventListener("pointerdown",function(e){
  e.preventDefault(); e.stopPropagation();
  scrubbing=true; try{ seek.setPointerCapture(e.pointerId); }catch(x){}
  seekTo(e);
});
seek.addEventListener("pointermove",function(e){ if(scrubbing) seekTo(e); });
["pointerup","pointercancel"].forEach(function(ev){
  seek.addEventListener(ev,function(e){
    if(!scrubbing) return; scrubbing=false;
    try{ seek.releasePointerCapture(e.pointerId); }catch(x){}
  });
});
/* arrows nudge, for a keyboard */
seek.addEventListener("keydown",function(e){
  var d=tvv.duration; if(!d||!isFinite(d)) return;
  if(e.key==="ArrowLeft"){ e.preventDefault(); tvv.currentTime=Math.max(0,tvv.currentTime-5); }
  if(e.key==="ArrowRight"){ e.preventDefault(); tvv.currentTime=Math.min(d,tvv.currentTime+5); }
});
tvv.addEventListener("timeupdate",paintSeek);
tvv.addEventListener("loadedmetadata",paintSeek);

unmute.onclick=function(){
  tvSound=true; tvv.muted=false; unmute.hidden=true;
  hushRadio();                      /* now it has a voice, it gets the room */
  try{ tvv.play(); }catch(e){}
};
/* switch the set on: CH 01, our own transmission, silent until asked */
tune(0);
/* belt-and-suspenders autoplay: once the player loads, order it to play
   (some browsers ignore the autoplay param inside nested frames) */
yt.addEventListener("load",function(){
  if(cur<0 || isLocal(CHANNELS[cur]))return;
  var kick=function(){try{yt.contentWindow.postMessage(JSON.stringify({event:"command",func:"playVideo",args:[]}),"*");}catch(e){}};
  /* One or two nudges is not enough: the player has to finish booting before it
     accepts commands, and how long that takes varies with the connection. Keep
     asking across the first few seconds — each call is a no-op once it plays. */
  [250,700,1400,2400,3600].forEach(function(ms){ setTimeout(kick,ms); });
});
/* ---- FULLSCREEN ----
   Three reasons this did nothing before:
     · iOS Safari cannot put a <div> fullscreen AT ALL. Only a <video> can go,
       through webkitEnterFullscreen — so on a phone the button was a no-op.
     · requestFullscreen returns a PROMISE that rejects (inside a frame without
       permission, or when the gesture is not trusted); nothing caught it.
     · the `|| function(){}` fallbacks swallowed every failure silently.
   So: try the real thing, fall back to the video's own fullscreen, and fall
   back again to filling the window ourselves — the button always does something. */
(function(){
  var wrap=document.getElementById("screenwrap"), btn=document.getElementById("tvfs");
  function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement||null; }
  function paint(){ btn.textContent = (fsEl()||wrap.classList.contains("faux")) ? "\u2715" : "\u26f6"; }
  function faux(){ wrap.classList.toggle("faux"); paint(); }
  function videoFS(){
    if(isLocal(CHANNELS[cur]) && tvv.webkitEnterFullscreen){
      try{ tvv.webkitEnterFullscreen(); return true; }catch(e){}
    }
    return false;
  }
  btn.onclick=function(e){
    e.preventDefault(); e.stopPropagation();
    if(wrap.classList.contains("faux")){ faux(); return; }
    if(fsEl()){
      try{ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }catch(err){}
      return;
    }
    var req = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
    if(req){
      try{
        var p = req.call(wrap);
        if(p && p.catch) p.catch(function(){ if(!videoFS()) faux(); });
        return;
      }catch(err){}
    }
    if(!videoFS()) faux();
  };
  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
    document.addEventListener(ev,function(){
      paint();
      /* nudge playback in case the transition paused it — never reload the src */
      if(isLocal(CHANNELS[cur])){ try{ tvv.play(); }catch(e){} }
      else { try{ yt.contentWindow.postMessage(JSON.stringify({event:"command",func:"playVideo",args:[]}),"*"); }catch(e){} }
    });
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape" && wrap.classList.contains("faux")) faux();
  });
  paint();
})();
document.getElementById("chup").onclick=function(){tune(cur+1);};
document.getElementById("chdn").onclick=function(){tune(cur<0?CHANNELS.length-1:cur-1);};
addEventListener("keydown",function(e){
  if(e.key==="ArrowUp"||e.key==="PageUp"){e.preventDefault();tune(cur+1);}
  if(e.key==="ArrowDown"||e.key==="PageDown"){e.preventDefault();tune(cur<0?CHANNELS.length-1:cur-1);}
});
})();
</script>
