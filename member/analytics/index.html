<!doctype html>
<html lang="en"><head>

<style>
:root{--bg:#071012;--panel:#102125;--ink:#eaf1ed;--dim:#86a0a0;--acid:#e8dc12;--pink:#ff1f6f;--line:#27444a;--px:'Press Start 2P',monospace;--vt:'VT323',monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -30%,#193b3e,var(--bg) 60%);color:var(--ink);font-family:var(--vt);font-size:20px}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}main{max-width:1000px;margin:auto;padding:36px 18px 80px;position:relative;z-index:1}a{color:var(--acid);font-family:var(--px);font-size:8px;text-decoration:none}h1{font-family:var(--px);font-size:clamp(18px,4vw,30px);color:var(--acid);line-height:1.5;margin:20px 0 5px}.sub{color:var(--dim);margin-bottom:25px}.bar{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.period button{background:transparent;color:var(--dim);border:1px solid var(--line);font:8px var(--px);padding:10px;cursor:pointer}.period button.on{color:#05080a;background:var(--acid);border-color:var(--acid)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.table{border:1px solid var(--line);background:rgba(16,33,37,.88)}.card{padding:16px}.label{font:8px var(--px);color:var(--dim);line-height:1.6}.num{font:clamp(27px,4vw,42px) var(--vt);color:var(--acid);margin-top:8px}.table{padding:15px;margin-top:15px}.table h2{font:10px var(--px);color:var(--pink);margin:0 0 14px}.row{display:grid;grid-template-columns:minmax(0,1fr) 75px 75px 75px;gap:10px;padding:8px 0;border-top:1px solid #1d3438}.row:first-of-type{border-top:0}.row span:not(:first-child){text-align:right;color:var(--dim)}.row.head{font:7px var(--px);color:var(--dim)}.row.head span{color:var(--dim)}#notice{border:1px solid #6d343d;padding:14px;color:#ff9ebd;background:#201017}.hide{display:none}@media(max-width:680px){.cards{grid-template-columns:1fr 1fr}.row{grid-template-columns:minmax(0,1fr) 56px 56px 56px;font-size:18px}.row.head{font-size:6px}} 
</style></head><body><main>
<a href="../../?p=room/">◀ BACK TO MY ROOM</a>
<div class="bar"><div><h1>PRIVATE SIGNALS</h1><div class="sub">anonymous site activity · only you can see this_</div></div><div class="period"><button data-days="7">7 DAYS</button><button class="on" data-days="30">30 DAYS</button><button data-days="90">90 DAYS</button></div></div>
<div id="notice">CONNECTING TO YOUR PRIVATE DASHBOARD_</div>
<section id="dash" class="hide"><div class="cards"><div class="card"><div class="label">VISITORS</div><div id="visitors" class="num">0</div></div><div class="card"><div class="label">PAGE VIEWS</div><div id="views" class="num">0</div></div><div class="card"><div class="label">ACTIVE MINUTES</div><div id="minutes" class="num">0</div></div><div class="card"><div class="label">EXITS</div><div id="exits" class="num">0</div></div></div>
<div class="table"><h2>WHAT PEOPLE ARE VIEWING</h2><div class="row head"><span>PAGE</span><span>VIEWS</span><span>EXITS</span><span>MIN</span></div><div id="pages"></div></div>
<div class="table"><h2>WHAT PEOPLE ARE DOING</h2><div class="row head"><span>EVENT</span><span style="grid-column:2 / 5">COUNT</span></div><div id="events"></div></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){"use strict";var U="https://hloxwicoeahczifshyoe.supabase.co",K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhsb3h3aWNvZWFoY3ppZnNoeW9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3MjM1MzMsImV4cCI6MjA5OTI5OTUzM30.IK7f4tU6Bb6O9oW5fwfO2Tv3dEZhh3IAj5y_91nier8",sb=window.supabase&&supabase.createClient(U,K),$=function(i){return document.getElementById(i)},days=30;
function esc(v){return String(v==null?'':v).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}function row(vals,cls){return'<div class="row '+(cls||'')+'">'+vals.map(function(v){return'<span>'+esc(v)+'</span>'}).join('')+'</div>'}function notice(t){$('notice').textContent=t;$('notice').classList.remove('hide');$('dash').classList.add('hide')}
async function load(){if(!sb){notice('DASHBOARD IS OFFLINE_');return}notice('READING YOUR PRIVATE SIGNALS_');var s=(await sb.auth.getSession()).data.session;if(!s){notice('SIGN IN FIRST — THEN OPEN THIS PAGE AGAIN_');return}var r=await sb.rpc('analytics_overview',{p_days:days});if(r.error){notice(r.error.message==='analytics dashboard is private'?'THIS ACCOUNT IS NOT YET AN ANALYTICS ADMIN — FOLLOW member/analytics.sql ONCE_':'DASHBOARD ERROR · '+r.error.message);return}var d=r.data||{};$('visitors').textContent=d.visitors||0;$('views').textContent=d.pageviews||0;$('minutes').textContent=d.active_minutes||0;$('exits').textContent=d.exits||0;$('pages').innerHTML=(d.pages||[]).map(function(p){return row([p.page,p.views,p.exits,p.minutes])}).join('')||row(['NO DATA YET','—','—','—']);$('events').innerHTML=(d.events||[]).map(function(e){return row([e.name,e.count,'',''])}).join('')||row(['NO EVENTS YET','—','','']);$('notice').classList.add('hide');$('dash').classList.remove('hide')}
document.querySelectorAll('[data-days]').forEach(function(b){b.onclick=function(){days=+b.dataset.days;document.querySelectorAll('[data-days]').forEach(function(x){x.classList.toggle('on',x===b)});load()}});load();})();
</script></body></html>
